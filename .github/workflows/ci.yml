name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.11
        with:
          args: '-ignore SC2'

  test:
    name: Unit Tests (changed only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run affected tests
        run: |
          # timeout sends SIGTERM after 240s if vitest hangs after tests complete.
          # Exit code 124 = timeout killed the process (tests passed but vitest didn't exit).
          timeout 240 npx vitest run --changed HEAD~1
          EXIT=$?
          if [ $EXIT -eq 124 ]; then
            echo "::warning::Vitest process hung after tests passed — killed by timeout"
            exit 0
          fi
          exit $EXIT
        timeout-minutes: 5

  build:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
