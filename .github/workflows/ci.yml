name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.11
        with:
          args: '-ignore SC2'

  test:
    name: Unit Tests (changed only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run affected tests
        run: npx vitest run --changed HEAD~1 2>&1 | tee /tmp/vitest-output.txt
        timeout-minutes: 3

      - name: Check for unhandled MSW requests
        if: always()
        run: |
          if grep -q "still wish to intercept this unhandled request" /tmp/vitest-output.txt 2>/dev/null; then
            echo "::error::Tests made HTTP requests without MSW handlers. Add handlers to src/test/mocks/handlers.ts"
            grep -B 3 "still wish to intercept this unhandled request" /tmp/vitest-output.txt
            exit 1
          fi

  build:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
